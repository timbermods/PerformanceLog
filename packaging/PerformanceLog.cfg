# Performance Log settings. Restart the game after editing.
# The defaults capture the most detail a session can hold without touching anything: deep profiling, every spike slot filled, and a
# sampling budget generous enough that profile.csv's numbers rest on real samples, not a rough scale-up. Just leave the mod enabled and
# play. This costs a bit more than a lighter profile would (see OverheadBudgetPercent below); lower these if that ever matters more than
# the detail. Nothing here changes what the game simulates, so multiplayer peers may use different values.
#
# SlowFrameMs, SummarySeconds, ProfileSeconds, OverheadBudgetPercent, SpikeContributors and MaxSlowRowsPerMinute can also be set on this
# mod's settings page: in Timberborn's Mods list (main menu, or Esc in a game), the settings button beside Performance Log. No restart
# is needed there; a change takes effect from the next game or save you load. The first time you open that page it starts from whatever
# is below; after that, whatever you set there is what is used, and editing the number here no longer does anything for that one
# setting. Enabled, Profile, Watch, AutoWatch and OutputFolder decide which parts of the game get patched, which happens before
# Mod Settings exists, so they are only ever read from here.

# false = the mod does nothing at all (no patches, no files).
Enabled = true

# A frame this long (milliseconds) or longer gets a row of its own in frames.csv, and its biggest contributors go to spikes.csv.
# 50 is 20 frames per second. Lower it to see smaller hitches (more rows), raise it for a shorter file. Also on the settings page.
SlowFrameMs = 50

# A summary row (an average over the window, plus histograms) is written this often, in seconds of real time. Also on the settings page.
SummarySeconds = 10

# profile.csv gets its rows this often, in seconds of real time. Also on the settings page.
ProfileSeconds = 30

# How much detail the profile has. Not on the settings page: it decides whether the entity tick (and, for deep, every entity component) is
# patched at all, which is settled before Mod Settings exists.
#   off      no per-entity profile and no patch on the entity tick at all (frame, tick and singleton timing stay)
#   standard every singleton is timed on every call; entity kinds are sampled
#   deep     also samples every kind of entity component (Walker, Workplace...). Costs a little more.          (default)
Profile = deep

# How much of a second the sampling may spend measuring, in percent. The sampling interval widens by itself when there are
# many entities so measuring stays under this. The real cost is written to the header of frames.csv (overheadUs). Also on the settings page.
OverheadBudgetPercent = 1

# How many of the biggest contributors to each slow frame are written to spikes.csv (0-8). Also on the settings page.
SpikeContributors = 8

# At most this many slow frames get a row of their own a minute (10-6000). The rest are only counted (summary.md says how many), so a game that is
# slow all the time cannot fill the disk. Also on the settings page.
MaxSlowRowsPerMinute = 300

# Where the session folders go. Empty = Documents/Timberborn/PerformanceLog.
OutputFolder =

# Methods to time, including everything inside them and every patch on them. One or more full names, Namespace.Type.Method,
# separated by ; and on as many lines as you like (at most 40). All overloads are watched. Rows appear in profile.csv as kind 'method'.
# Use this to measure a mod's own work or a game method that mods patch. The mod must be enabled for its type to be found.
# Examples (remove the # to use):
# Watch = Timberborn.TickSystem.Ticker.Update
# Watch = LateGamePerformance.HaulCache.OnTickStarted; LateGamePerformance.MetricsDump.OnTickStarted

# true = also time the patch methods other mods put on the game's hot methods, each on a row of its own (kind 'method'), so a mod's cost that
# runs inside a game row (a prefix on every entity's tick, say) is seen. It fills the Watch slots the Watch lines above leave free (40 methods in
# all): first patches on the per-tick and per-frame methods of singletons, entities and components, then those on the other hot methods, in
# name order; the frames.csv header lists what it took and what it left out. It adds only its own timing patch around each patch method, when
# the first game is loaded, changes no other mod's patch, and leaves the game's random numbers as it found them (BeaverBuddies co-op).
# Off by default: every call of a watched method costs a little (see overheadUs).
AutoWatch = false
